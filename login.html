<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean House - Tài khoản khách hàng</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="auth-page">
        <section class="brand-panel">
            <p class="eyebrow">Bean House</p>
            <h1>Tài khoản khách hàng Bean House</h1>
            <p>Đăng nhập bằng Firebase Authentication để xem menu cà phê và tạo giỏ hàng của bạn.</p>
        </section>

        <section class="auth-card">
            <div class="tabs" aria-label="Chọn chế độ tài khoản">
                <button id="showLoginBtn" class="tab active" type="button">Đăng nhập</button>
                <button id="showRegisterBtn" class="tab" type="button">Đăng ký</button>
            </div>

            <form id="loginForm" class="auth-form">
                <h2>Đăng nhập</h2>
                <label>
                    Email
                    <input id="loginEmail" type="email" autocomplete="email" required>
                </label>
                <label>
                    Mật khẩu
                    <input id="loginPassword" type="password" autocomplete="current-password" required>
                </label>
                <button id="loginSubmitBtn" class="button" type="submit">Đăng nhập</button>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <h2>Tạo tài khoản</h2>
                <label>
                    Email
                    <input id="registerEmail" type="email" autocomplete="email" required>
                </label>
                <label>
                    Mật khẩu
                    <input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required>
                </label>
                <button id="registerSubmitBtn" class="button" type="submit">Đăng ký</button>
            </form>

            <p id="authMessage" class="message" role="status"></p>
        </section>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
