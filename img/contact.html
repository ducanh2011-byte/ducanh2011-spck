    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
    <a href="./index.html">
        <div class="logo">META</div>
    </a>
    <nav>
        <a href="./index.html">Home</a>
        <a href="./detail_product.html">Chi tiết sản phẩm</a>

<section class="contact">
    <h2>Liên hệ với chúng tôi</h2>
    <p>Nếu bạn có bất kỳ câu hỏi nào, vui lòng điền thông tin bên dưới.</p>

    <form class="contact-form">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" placeholder="Nhập họ và tên">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Nhập email">
        </div>

        <div class="form-group">
            <label>Nội dung</label>
            <textarea rows="5" placeholder="Nhập nội dung liên hệ"></textarea>
        </div>

        <button type="submit">Gửi liên hệ</button>
    </form>

    <div class="contact-info">
        <h3>Thông tin cửa hàng</h3>
        <p>📍 Địa chỉ: Hà Nội, Việt Nam</p>
        <p>📞 Điện thoại: 0123 456 789</p>
        <p>📧 Email: meta@gmail.com</p>
    </div>
</section>

<footer>
    <p>© 2025 META Store</p>
</footer>
