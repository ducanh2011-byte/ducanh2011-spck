<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f6f8;
            font-family: Arial;
        }
        .success {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }
        .icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #4CAF50;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="success">
    <div class="icon">✓</div>
    <h2>Thanh toán thành công</h2>
    <p>Cảm ơn bạn đã mua hàng!</p>
    <a href="index.html">Về trang chủ</a>
</div>

</body>
</html>
